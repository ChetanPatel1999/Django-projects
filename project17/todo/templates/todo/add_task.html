{% extends "todo/base.html" %}
{% block content %} 
   {% if task %}
    <h1 class="text-2xl font-bold">EditTask</h1>
    {% else %}
    <h1 class="text-2xl font-bold">Add Task</h1>
    {% endif %}
   {% if error %}
       <p class="text-red-500 mt-2">{{ error }}</p>
   {% endif %}
   <form method="post" class="mt-4" action="{% if task %}{% url 'todo:edit_task' task.id %}{% else %}{% url 'todo:add_task' %}{% endif %}">
       {% csrf_token %}
       <div class="mb-4">
           <label for="title" class="block text-gray-700 font-bold mb-2">Title:</label>
           <input value="{{ task.title }}" type="text" name="title" id="title" class="border border-gray-300 rounded-md px-3 py-2 w-full" >
       </div>
       <div class="mb-4">
           <label for="description" class="block text-gray-700 font-bold mb-2">Description:</label>
           <textarea name="description" id="description" rows="4" class="border border-gray-300 rounded-md px-3 py-2 w-full" >{{ task.description }}</textarea>
       </div>
       {% if task %}
         <div class="mb-4">
              <label for="completed" class="block text-gray-700 font-bold mb-2">Completed:</label>
              <input type="checkbox" name="completed" id="completed" {% if task.completed %}checked{% endif %}>
        </div>
       {% endif %}
       <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Save</button>
       <a href="{% url 'todo:show_tasks' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded ml-2">Cancel</a>
    </form>
{% endblock %}
