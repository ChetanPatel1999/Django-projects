{% extends 'todo/base.html' %}
{% block content %}
<h1 class="text-2xl font-bold">All Tasks</h1>
<table class="table-auto w-full mt-4 text-start border-separate border-spacing-y-2">
    <thead>
        <tr>
            <th class="text-start ps-2">Title</th>
            <th class="text-start ps-2">Description</th>
            <th class="text-start ps-2">Done</th>
            <th class="text-start ps-2">Created</th>
            <th class="text-start ps-2">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for task in tasks %}
        <tr class="bg-gray-200">
            <td class="font-medium py-3 px-3 mt-2 text-gray-900">{{ task.title }}</td>
            <td class="font-medium py-3 px-3 mt-2 text-gray-900">{{ task.description }}</td>
            <td class="font-medium py-3 px-3 mt-2 text-gray-900">{{ task.completed }}</td>
            <td class="font-medium py-3 px-3 mt-2 text-gray-900">{{ task.created_at }}</td>
            <td class="font-medium py-3 px-3 mt-2 text-gray-900">
                <a href="#" class="bg-yellow-500 hover:bg-yellow-800 text-white py-1 px-3 rounded">Edit</a>
                <a href="#" class="bg-red-600 hover:bg-red-800 text-white py-1 px-3 rounded ml-2">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
