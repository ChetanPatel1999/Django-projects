{% extends "student/base.html" %}

{% block content %}
    {% if student %}
        <h1 class="text-2xl font-bold mb-4">Update Student</h1>
    {% else %}
        <h1 class="text-2xl font-bold mb-4">Create Student</h1>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold mt-5 py-2 px-4 rounded" type="submit">
            {% if student %}
                Update Student
            {% else %}
                Create Student
            {% endif %}
        </button>
        <a href="{% url 'student:student_list' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold mt-5 py-2 px-4 rounded">Cancel</a>
    </form>
{% endblock %}
