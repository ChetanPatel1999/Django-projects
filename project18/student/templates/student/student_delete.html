{% extends "student/base.html" %}

{% block content %}
    <h1 class="text-2xl font-bold mb-4">Delete Student</h1>
    <p class="font-medium">Are you sure you want to delete {{ student.name }}?</p>
    <form method="post" class="mt-4">
        {% csrf_token %}
        <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded" type="submit">Yes, Delete</button>
        <a href="{% url 'student:student_list' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">Cancel</a>
    </form>
{% endblock %}
