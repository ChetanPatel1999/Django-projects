{% extends "student/base.html" %}

{% block content %}
    <h1 class="text-2xl font-bold mb-4">Student Detail</h1>
    <p class="font-medium">Name: {{ student.name }}</p>
    <p class="font-medium">Email: {{ student.email }}</p>
    <p class="font-medium">Age: {{ student.age }}</p>
    <a href="{% url 'student:student_list' %}" class="bg-blue-500 hover:bg-gray-700 text-white font-bold mt-4 inline-block py-2 px-4 rounded">Back to List</a>
{% endblock %}
