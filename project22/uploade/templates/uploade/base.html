<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Upload Photo</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg">

        <div class="max-w-6xl mx-auto px-6 py-5">

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                <!-- Website Title -->
                <h1 class="text-2xl md:text-3xl font-bold">
                    Student Upload Photo
                </h1>

                <!-- Navigation -->
                <nav>
                    <ul class="flex flex-wrap gap-3">

                        <li>
                            <a href="{% url 'display_files' %}"
                               class="inline-block px-5 py-2 rounded-lg bg-white text-blue-600 font-semibold
                                      hover:bg-blue-50 hover:shadow-md transition duration-300">
                                Display Image
                            </a>
                        </li>

                        <li>
                            <a href="{% url 'upload_file' %}"
                               class="inline-block px-5 py-2 rounded-lg bg-blue-500 border border-white
                                      font-semibold hover:bg-white hover:text-blue-600
                                      hover:shadow-md transition duration-300">
                                Upload Image
                            </a>
                        </li>

                    </ul>
                </nav>

            </div>

        </div>

    </header>


    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-10">

        {% block content %}

        {% endblock %}

    </main>

</body>

</html>
