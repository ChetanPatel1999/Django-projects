<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Channel List</h1>
    {% if channel %}
        <h2>{{ channel.name }}</h2>
        <p>{{ channel.description }}</p>
        <p>Subscribers: {{ channel.subscribers_count }}</p>
    {% else %}
        <p>No channels available.</p>
    {% endif %}
</body>
</html>
